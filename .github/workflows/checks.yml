name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B examples/replay_repo_fix.py "$RUNNER_TEMP/vesper-repo-pilot"
